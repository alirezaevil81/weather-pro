<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Canvas 3D Depth Gradient -->
    <linearGradient id="bgGrad3D" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>

    <!-- Subtle Outer Rim Reflection -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 3D Sun Sphere Radial Gradient -->
    <radialGradient id="sun3D" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffae0"/>
      <stop offset="25%" stop-color="#fcd34d"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Sun Glow Effect -->
    <filter id="sunGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 3D Cloud Volumetric Gradient -->
    <linearGradient id="cloudBody3D" x1="20" y1="35" x2="95" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Cloud Glossy Highlight Contour -->
    <linearGradient id="cloudHighlight" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Realistic 3D Soft Drop Shadows -->
    <filter id="cloudShadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#030712" flood-opacity="0.6"/>
    </filter>
    
    <filter id="sunShadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="6" stdDeviation="5" flood-color="#090d16" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 3D Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="32" fill="url(#bgGrad3D)"/>
  <rect x="6" y="6" width="116" height="116" rx="32" stroke="url(#rimGrad)" stroke-width="2" fill="none"/>

  <!-- Minimal 3D Sun Sphere -->
  <g filter="url(#sunGlowFilter)">
    <circle cx="48" cy="46" r="23" fill="url(#sun3D)" filter="url(#sunShadow3D)"/>
    <!-- Sun 3D Top Specular Highlight -->
    <circle cx="42" cy="38" r="7" fill="#ffffff" opacity="0.4" filter="blur(2px)"/>
  </g>

  <!-- Minimal 3D Claymorphic Cloud -->
  <g filter="url(#cloudShadow3D)">
    <!-- Main Volumetric Cloud Geometry -->
    <path d="M40 92 h46 a17 17 0 0 0 3.5 -33.6 a24 24 0 0 0 -44.8 -8.4 a18.5 18.5 0 0 0 -4.7 37.6 z" fill="url(#cloudBody3D)"/>
    
    <!-- 3D Volume Curves (Inner Shadow / Depth overlay) -->
    <path d="M40 92 h46 a17 17 0 0 0 17 -17 c0 -7.2 -4.5 -13.4 -11 -15.8 a24 24 0 0 1 -23 15.8 c-9.5 0 -17.8 -5.5 -21.8 -13.5 a18.5 18.5 0 0 0 -5.2 30.5 z" fill="#64748b" opacity="0.2"/>

    <!-- 3D Top Rim Specular Gloss -->
    <path d="M41 90 h44 a15 15 0 0 0 3 -29.6 a22 22 0 0 0 -41.2 -7.5 a16.5 16.5 0 0 0 -3.8 32.6 z" fill="url(#cloudHighlight)" opacity="0.65"/>
  </g>
</svg>
